<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
</head>
<body>
  {% set root = get_section(path="_index.md") %}
  <div class="layout">
    <nav class="side" aria-label="Guide">
      <a class="brand" href="{{ root.permalink }}">{{ config.title }}</a>
      <ul>
        {% for p in root.pages %}
        <li><a href="{{ p.permalink }}"{% if current_path == p.path %} aria-current="page"{% endif %}>{{ p.title }}</a></li>
        {% endfor %}
        <li class="maplink"><a href="{{ get_url(path='map.html') }}">Interactive map</a></li>
      </ul>
    </nav>
    <main>
      {% block content %}{% endblock content %}
    </main>
  </div>
</body>
</html>
